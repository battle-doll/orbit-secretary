name: Offline validation and reproducible packages

'on':
  pull_request:
  push:
    branches: ["codex/release-prep"]
    tags: ["**"]
  workflow_dispatch:

concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.event_name == 'push' && github.ref == 'refs/heads/codex/release-prep' && 'default' || format('isolated-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/codex/release-prep') }}

permissions:
  contents: read

jobs:
  offline-validation:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      # Automatic checks cover the oldest/newest supported Python; tag and manual checks retain every platform.
      matrix: ${{ fromJSON((github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')) && '{"os":["ubuntu-latest","macos-latest","windows-latest"],"python-version":["3.10","3.14"]}' || '{"include":[{"os":"ubuntu-latest","python-version":"3.10"},{"os":"ubuntu-latest","python-version":"3.14"}]}') }}
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
      PYTHONTZPATH: ''
    steps:
      - name: Check out public package source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pinned validation dependencies and timezone data
        run: python -m pip install -r requirements-dev.txt
      - name: Validate package scope, syntax and links
        run: python scripts/validate_package.py --report dist/validation-local.json
      - name: Run all synthetic and packaging tests
        run: python -m unittest discover -s tests -v
      - name: Demonstrate offline-only decisions
        run: python scripts/offline_core.py demo
      - name: Build deterministic source and skills-only archives
        run: python scripts/build_release.py
      - name: Verify archives and their SHA256SUMS
        run: python scripts/build_release.py --verify
      - name: Retain review artifacts without publishing a release
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: offline-packages-${{ matrix.os }}-py${{ matrix.python-version }}
          path: |
            dist/*.zip
            dist/SHA256SUMS
            dist/build-info.json
            dist/validation-local.json
          if-no-files-found: error
          retention-days: 7
